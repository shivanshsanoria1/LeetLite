<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Problem Details - LeetLite</title>
	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Highlight.js (Dynamic Theme) -->
	<link id="hljs-theme-link" rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/monokai.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

	<!-- Highlight.js Line Numbers Plugin -->
	<script
		src="https://cdn.jsdelivr.net/npm/highlightjs-line-numbers.js@2.8.0/dist/highlightjs-line-numbers.min.js"></script>

	<!-- Highlight.js Copy Button Plugin -->
	<link rel="stylesheet" href="https://unpkg.com/highlightjs-copy/dist/highlightjs-copy.min.css" />
	<script src="https://unpkg.com/highlightjs-copy/dist/highlightjs-copy.min.js"></script>

	<!-- Add this in your <head>, right below Highlight.js -->
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

	<!-- MathJax Configuration to allow single $ delimiters -->
	<script>
		window.MathJax = {
			tex: {
				inlineMath: [['$', '$'], ['\\(', '\\)']],
				displayMath: [['$$', '$$'], ['\\[', '\\]']]
			}
		};
	</script>

	<!-- MathJax for rendering LeetCode LaTeX -->
	<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

	<!-- Custom components CSS -->
	<link href="../css/components.css" rel="stylesheet">

	<!-- Custom CSS -->
	<link href="../css/problem.css" rel="stylesheet">
</head>

<body class="overflow-hidden bg-body d-flex flex-column" style="height: 100vh;">

	<!-- Navbar Placeholder -->
	<div id="navbar-placeholder"></div>

	<!-- Split Workspace -->
	<div class="d-flex flex-grow-1 workspace-container">

		<!-- Left Panel: Problem Details -->
		<div id="left-pane" class="pane p-4 overflow-auto">
			<!-- Loading Spinner -->
			<div id="loading-spinner" class="text-center mt-5">
				<div class="spinner-border text-secondary" role="status"></div>
			</div>

			<div id="problem-content-wrapper" style="display: none;">
				<h3 class="fw-bold mb-3"><span id="prob-id"></span>. <span id="prob-title"></span></h3>

				<!-- Row 1: Difficulty, Likes, Dislikes, Like Rate -->
				<div class="d-flex flex-wrap align-items-center gap-3 mb-2 text-secondary fs-6">
					<span id="prob-difficulty" class="fw-bold"></span>
					<div class="vr"></div>

					<span class="d-flex align-items-center gap-1 text-success" title="Likes">
						<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
							viewBox="0 0 16 16">
							<path
								d="M6.956 1.745C7.021.81 7.908.087 8.864.325l.261.066c.463.116.874.456 1.012.965.22.816.533 2.511.062 4.51a10 10 0 0 1 .443-.051c.713-.065 1.669-.072 2.516.21.518.173.994.681 1.2 1.273.184.532.16 1.162-.234 1.733q.086.18.138.363c.077.27.113.567.113.856s-.036.586-.113.856c-.039.135-.09.273-.16.404.169.387.107.819-.003 1.148a3.2 3.2 0 0 1-.488.901c.054.152.076.312.076.465 0 .305-.089.625-.253.912C13.1 15.522 12.437 16 11.5 16H8c-.605 0-1.07-.081-1.466-.218a4.8 4.8 0 0 1-.97-.484l-.048-.03c-.504-.307-.999-.609-2.068-.722C2.682 14.464 2 13.846 2 13V9c0-.85.685-1.432 1.357-1.615.849-.232 1.574-.787 2.132-1.41.56-.627.914-1.28 1.039-1.639.199-.575.356-1.539.428-2.59z" />
						</svg>
						<span id="prob-likes" class="fw-bold">0</span>
					</span>
					<div class="vr"></div>

					<span class="d-flex align-items-center gap-1 text-danger" title="Dislikes">
						<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
							viewBox="0 0 16 16">
							<path
								d="M6.956 14.255c.065.935.952 1.658 1.908 1.42l.261-.065a1.38 1.38 0 0 0 1.012-.965c.22-.816.533-2.512.062-4.51.136.02.285.037.443.051.713.065 1.669.071 2.516-.211.518-.173.994-.68 1.2-1.272.184-.532.16-1.162-.234-1.733a2.1 2.1 0 0 0 .138-.364c.077-.27.113-.568.113-.856 0-.29-.036-.586-.113-.857a2 2 0 0 0-.16-.403c.169-.387.107-.82-.003-1.149a3.2 3.2 0 0 0-.488-.901 2 2 0 0 0-.076-.465c0-.305-.089-.625-.253-.912C13.1.478 12.437 0 11.5 0H8c-.605 0-1.07.081-1.466.218a4.8 4.8 0 0 0-.97.484l-.048.03c-.504.307-.999.609-2.068.722C2.682 1.536 2 2.154 2 3v4c0 .85.685 1.432 1.357 1.615.849.232 1.574.787 2.132 1.41.56.626.914 1.28 1.039 1.638.199.575.356 1.539.428 2.59z" />
						</svg>
						<span id="prob-dislikes" class="fw-bold">0</span>
					</span>
					<div class="vr"></div>

					<span>Like Rate: <span id="prob-like-rate" class="fw-bold">0%</span></span>
				</div>

				<!-- Row 2: Accepted, Submissions, Acceptance Rate, Category -->
				<div
					class="d-flex flex-wrap align-items-center gap-3 mb-4 text-secondary fs-6 border-bottom border-secondary pb-3">
					<span id="prob-category" class="badge bg-dark border border-secondary text-light"></span>
					<div class="vr"></div>

					<span>Accepted: <span id="prob-accepted" class="text-light fw-bold">0</span></span>
					<div class="vr"></div>

					<span>Submissions: <span id="prob-submissions" class="text-light fw-bold">0</span></span>
					<div class="vr"></div>

					<span>Acceptance Rate: <span id="prob-ac" class="fw-bold">0%</span></span>
				</div>

				<!-- Problem Description -->
				<div id="prob-content" class="problem-description mb-4 text-light"></div>

				<hr class="border-secondary mb-4">

				<!-- Topic Tags -->
				<div class="mb-4">
					<h6 class="fw-bold text-secondary mb-2">Topic Tags</h6>
					<div id="prob-tags" class="d-flex flex-wrap gap-2"></div>
				</div>

				<!-- Hints Accordion -->
				<div class="mb-4">
					<h6 class="fw-bold text-success mb-2">Hints</h6>
					<div class="accordion accordion-flush border border-secondary rounded" id="hintsAccordion"></div>
				</div>

				<!-- NEW: Official Solution -->
				<div class="mb-4" id="solution-wrapper" style="display: none;">
					<h6 class="fw-bold text-primary mb-2">Official Solution</h6>
					<div class="accordion accordion-flush border border-secondary rounded" id="solutionAccordion">
						<div class="accordion-item bg-dark border-secondary">
							<h2 class="accordion-header">
								<button class="accordion-button collapsed bg-dark text-light shadow-none" type="button"
									data-bs-toggle="collapse" data-bs-target="#collapseSolution">
									View Official Solution
								</button>
							</h2>
							<div id="collapseSolution" class="accordion-collapse collapse"
								data-bs-parent="#solutionAccordion">
								<div class="accordion-body text-light problem-description" id="prob-solution-content">
									<!-- Solution injected here -->
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- Similar Questions List -->
				<div class="mb-4">
					<h6 class="fw-bold text-info mb-2">Similar Questions</h6>
					<div id="prob-similar-list"></div>
				</div>

				<!-- MOVED FOOTER PLACEHOLDER HERE so it scrolls with the left pane -->
				<div id="footer-placeholder"></div>
			</div>
		</div>

		<!-- Vertical Resizer with 3 dots -->
		<div id="resizer"
			class="resizer bg-dark border-start border-end border-secondary d-flex align-items-center justify-content-center text-secondary">
			<span>&#8942;</span>
		</div>

		<!-- Right Panel: Code Editor -->
		<div id="right-pane" class="pane bg-dark d-flex flex-column">

			<!-- Editor Toolbar -->
			<div class="d-flex align-items-center flex-nowrap p-2 bg-body border-bottom border-secondary gap-2">

				<!-- Language Selector -->
				<div class="d-flex align-items-center gap-1">
					<label for="lang-select" class="text-secondary fw-bold mb-0 small">Language</label>
					<select id="lang-select"
						class="form-select form-select-sm bg-dark text-light border-secondary w-auto">
						<option value="">-</option>
					</select>
				</div>

				<!-- Version Selector -->
				<div class="d-flex align-items-center gap-1">
					<label for="version-select" class="text-secondary fw-bold mb-0 small">Version</label>
					<select id="version-select"
						class="form-select form-select-sm bg-dark text-light border-secondary w-auto">
						<option value="">-</option>
					</select>
				</div>

				<!-- Complexity Display Block -->
				<div id="complexity-block"
					class="d-none align-items-center gap-1 px-1 py-1 rounded border border-secondary"
					style="background-color: #121416; font-family: monospace; font-size: 12px; white-space: nowrap;">
					<span class="text-secondary">T.C: <span id="tc-val" class="text-success fw-bold">-</span></span>
					<div class="vr text-secondary mx-1"></div>
					<span class="text-secondary">S.C: <span id="sc-val" class="text-success fw-bold">-</span></span>
				</div>

				<!-- Action Buttons Group (Right Aligned) -->
				<div class="d-flex align-items-center gap-2 ms-auto">
					<!-- Editor Settings Gear Button -->
					<button type="button"
						class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center"
						data-bs-toggle="modal" data-bs-target="#editorSettingsModal" title="Editor Settings"
						style="width: 32px; height: 32px;">
						<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
							class="bi bi-gear-fill" viewBox="0 0 16 16">
							<path
								d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z" />
						</svg>
					</button>

					<!-- Reset Editor Button -->
					<button id="reset-editor-btn"
						class="btn btn-sm btn-outline-danger d-flex align-items-center justify-content-center"
						title="Reset to Default" style="width: 32px; height: 32px;">
						<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
							class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
							<path fill-rule="evenodd"
								d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z" />
							<path
								d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z" />
						</svg>
					</button>
				</div>
			</div>

			<!-- Code Editor Content -->
			<div id="code-editor-container" class="flex-grow-1 overflow-auto w-100">
				<div class="d-flex h-100 align-items-center justify-content-center text-secondary">
					<h5>Select a language and version to view code</h5>
				</div>
			</div>
		</div>
	</div>

	<!-- Editor Settings Modal -->
	<div class="modal fade" id="editorSettingsModal" tabindex="-1" aria-labelledby="editorSettingsModalLabel"
		aria-hidden="true">
		<!-- Removed modal-sm for a standard, wider modal footprint -->
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content bg-dark border-secondary">
				<div class="modal-header border-secondary">
					<h6 class="modal-title fw-bold text-light" id="editorSettingsModalLabel">Editor Settings</h6>
					<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<!-- Added pb-5 to ensure the dropdown menu doesn't crowd the bottom edge -->
				<div class="modal-body text-secondary pb-5">
					<!-- Theme Selector -->
					<div class="mb-2">
						<label for="theme-select" class="form-label text-light fw-semibold small mb-1">Theme</label>
						<select id="theme-select"
							class="form-select form-select-sm bg-dark text-light border-secondary shadow-sm">
							<option value="a11y-dark">A11y Dark</option>
							<option value="github-dark">GitHub Dark</option>
							<option value="monokai">Monokai</option>
							<option value="nord">Nord</option>
							<option value="obsidian">Obsidian</option>
						</select>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<!-- 1. Load the navbar first -->
	<script src="../js/components.js"></script>
	<!-- Custom JS -->
	<script type="module" src="../js/problem.js"></script>
</body>

</html>

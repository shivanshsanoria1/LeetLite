<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Stats - LeetLite</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Custom components CSS -->
	<link href="../css/components.css" rel="stylesheet">
	<link href="../css/stats.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="d-flex flex-column vh-100 bg-body overflow-hidden">

	<div id="navbar-placeholder"></div>

	<div class="d-flex flex-grow-1 h-100 overflow-hidden">

		<!-- Sidebar -->
		<div class="p-4 bg-body-tertiary border-end border-secondary overflow-auto"
			style="flex: 0 0 25%; max-width: 25%;">
			<h5 class="fw-bold text-light mb-4">Chart Types</h5>
			<div class="list-group list-group-flush rounded border border-secondary">
				<button class="list-group-item list-group-item-action bg-dark text-primary fw-semibold border-secondary"
					id="btn-difficulty">
					Difficulty Distribution
				</button>
				<button class="list-group-item list-group-item-action bg-dark text-light border-secondary"
					id="btn-category">
					Problem Type Distribution
				</button>
				<button class="list-group-item list-group-item-action bg-dark text-light border-secondary"
					id="btn-tags">
					Topic Tags Distribution
				</button>
				<!-- NEW: Heatmap Button -->
				<button class="list-group-item list-group-item-action bg-dark text-light border-secondary"
					id="btn-heatmap">
					Problem Heatmap
				</button>
			</div>
		</div>

		<!-- Chart Display -->
		<div class="p-4 flex-grow-1 overflow-auto bg-body d-flex flex-column">

			<!-- Heatmap Controls & Legend Row (Hidden by default) -->
			<div id="heatmap-header" class="d-none d-flex flex-wrap align-items-center gap-4 mb-4 px-2 pt-2">
				<!-- Dropdown Controls -->
				<div class="d-flex align-items-center gap-2 border-end border-secondary pe-4">
					<span class="text-secondary fw-semibold small">Color By:</span>
					<select id="heatmap-color-select"
						class="form-select form-select-sm bg-dark text-light border-secondary shadow-sm"
						style="width: auto;">
						<option value="difficulty">Difficulty</option>
						<option value="category">Category</option>
					</select>
				</div>

				<!-- Dynamic Legend -->
				<div id="heatmap-legend"
					class="d-flex flex-wrap align-items-center gap-3 text-secondary small fw-semibold">
					<!-- Legend items injected by JS -->
				</div>
			</div>

			<!-- Doughnut Charts View -->

			<!-- Dynamic Legend (Hidden by default) -->
			<div id="heatmap-legend"
				class="d-none d-flex flex-wrap justify-content-center gap-4 text-secondary small fw-semibold mb-4">
				<!-- Legend items injected by JS -->
			</div>

			<!-- ... Doughnut and Bar chart wrappers remain unchanged ... -->

			<!-- Heatmap View (Hidden by default) -->
			<div id="heatmap-wrapper" class="w-100 flex-grow-1 d-none overflow-auto" style="height: 65vh;">
				<div id="heatmap-container" class="d-grid gap-1 pb-4"></div>
			</div>

			<!-- Doughnut Charts View -->
			<div id="doughnut-wrapper" class="row w-100 flex-grow-1 align-items-start">

				<!-- Left Chart Column -->
				<div class="col-md-6 d-flex flex-column align-items-center">
					<h6 class="text-light mb-4 text-center fw-semibold fs-5">Leetcode problems</h6>

					<div class="chart-container">
						<canvas id="officialChart"></canvas>
						<div class="donut-center-text">
							<span class="text-secondary small fw-semibold">Total</span>
							<span class="fs-4 fw-bold text-light" id="officialTotal">0</span>
						</div>
					</div>

					<div id="officialLegend" class="mt-4 d-flex flex-wrap justify-content-center gap-3 w-100 px-4">
					</div>
				</div>

				<!-- Right Chart Column -->
				<div class="col-md-6 d-flex flex-column align-items-center">
					<h6 class="text-light mb-4 text-center fw-semibold fs-5">LeetLite available solutions</h6>

					<div class="chart-container">
						<canvas id="solvedChart"></canvas>
						<div class="donut-center-text">
							<span class="text-secondary small fw-semibold">Total</span>
							<span class="fs-4 fw-bold text-light" id="solvedTotal">0</span>
						</div>
					</div>

					<div id="solvedLegend" class="mt-4 d-flex flex-wrap justify-content-center gap-3 w-100 px-4"></div>
				</div>

			</div>

			<!-- Bar Chart View (Hidden by default) -->
			<div id="bar-wrapper" class="w-100 flex-grow-1 d-none overflow-auto" style="height: 65vh;">
				<!-- Inner container to hold dynamic height for scrolling -->
				<div id="bar-scroll-container" style="position: relative; width: 100%;">
					<canvas id="tagsBarChart"></canvas>
				</div>
			</div>
		</div>
	</div>

	<div id="footer-placeholder"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="../js/components.js"></script>
	<script type="module" src="../js/stats.js"></script>
</body>

</html>
